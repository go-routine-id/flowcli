name: release

# Pushing a `v*` tag builds a prebuilt binary per platform and publishes them,
# each with a `.sha256` next to it, as a GitHub release. install.sh and
# `flowcli --self-update` download from `releases/latest/download/<asset>`,
# so the asset names below are a contract — rename them in all three places.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # A tag that disagrees with Cargo.toml would ship binaries whose
  # `--version` lies about the release they came from.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          # musl, not gnu: a static binary runs on any distro, whereas a gnu
          # build from ubuntu-latest needs that runner's (new) glibc.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: flowcli-linux-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            name: flowcli-macos-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            name: flowcli-macos-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: flowcli-windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary + checksum
        shell: bash
        run: |
          out="${{ matrix.name }}${{ matrix.ext }}"
          mv "target/${{ matrix.target }}/release/flowcli${{ matrix.ext }}" "./$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}${{ matrix.ext }}
            ${{ matrix.name }}${{ matrix.ext }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
