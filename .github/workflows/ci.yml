name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # shellcheck ships on ubuntu-latest; install.sh is what users pipe into
      # bash, and the Herdr plugin scripts run on every install and pane open.
      - run: shellcheck install.sh herdr/scripts/*.sh
      # The Claude Code plugin ships its own copy of the agent skill; an edit
      # to one that misses the other would teach agents two different things.
      - run: cmp herdr/skill/SKILL.md claude/skills/flowcli/SKILL.md
